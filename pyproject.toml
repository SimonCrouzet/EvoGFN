[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evogfn"
version = "0.1.0.dev0"
description = "GFlowNets for in-silico directed evolution: sampling diverse, feasible, high-fitness protein variants."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "EvoGFN Contributors" }]
keywords = [
    "gflownet",
    "directed-evolution",
    "protein-engineering",
    "fitness-landscape",
    "generative-models",
    "active-learning",
    "multi-objective-optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "hydra-core>=1.3",
    # Thread-pool limits that apply after the numerical libraries have loaded.
    # The OMP_/MKL_/OPENBLAS_ environment variables are read once, when the
    # library is dlopen'd at `import numpy`, so setting them from Python is
    # always too late for the current process; threadpoolctl reaches into the
    # loaded pools instead. Required rather than optional: without it the
    # benchmark cannot verify the condition its records claim to have run
    # under, and an unverifiable determinism flag is worse than no flag.
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]

# pytorch-holo (Stanton et al.'s own Ehrlich implementation) is deliberately
# NOT a dependency here, optional or otherwise: it requires numpy<2.0, which
# drags this project's whole resolution backwards. It lives in its own
# environment instead -- see notes/ for the path.

# Multi-objective indicators at any front size.
#
# The core's exact hypervolume is inclusion-exclusion over the front, which
# sums 2^k terms and therefore stops at 16 points in three or more objectives
# -- a limit converged runs reach, so the column goes missing for the arms that
# did best. pymoo's HV is exact and polynomial in the front size, and it is the
# reference implementation the literature reports against.
#
# Optional, and the core must keep working without it: nothing outside
# `evogfn.metrics.pareto` imports pymoo, and that module falls back to its own
# exact method when the import fails. Anyone who does not run the
# multi-objective suite keeps a numpy+torch install.
#
# Unlike pytorch-holo above, this one resolves: pymoo 0.6.2 installs against
# numpy 2.x, so it does not drag the whole environment backwards.
#
#   uv sync --extra moo     hypervolume at any front size
moo = ["pymoo>=0.6.2"]


# Torch build selection. These extras add no dependency -- torch is already
# required -- they redirect it to a specific wheel index.
#
# GPU is the primary target: Ehrlich landscapes at the sequence lengths used in
# the literature (L=256) mean hundreds of forward passes per trajectory, which
# is where a GPU stops being optional. The default install is therefore the
# CUDA build, and CPU is the fallback for machines without a GPU and for CI,
# where ~40 nvidia-* packages and a 4.7GB environment would be pure waste
# (the CPU build is 1.1GB).
#
#   uv sync                 CUDA build on Linux -- the default, GPU-first
#   uv sync --extra cuda    same, pinned to an explicit CUDA wheel index
#   uv sync --extra cpu     CPU fallback: no GPU, or CI
cuda = ["torch>=2.4"]
cpu = ["torch>=2.4"]

[project.urls]
Homepage = "https://github.com/SimonCrouzet/EvoGFN"
Documentation = "https://simoncrouzet.github.io/evogfn"
Repository = "https://github.com/SimonCrouzet/EvoGFN"
Issues = "https://github.com/SimonCrouzet/EvoGFN/issues"

[project.scripts]
evogfn = "evogfn.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evogfn"]
# The YAML under src/evogfn/configs is picked up by the packages entry
# above, since it lives inside the package. A force-include would duplicate it
# and hatchling refuses to write the same path twice.

# Development dependencies, managed by uv. These are not part of any published
# extra: nobody installing the library from PyPI should pull in a test runner.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.165.2",
    "ruff>=0.16.2",
    "mypy>=1.13",
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",              # report why every non-passing test did not pass
    "--strict-markers", # a typo'd marker is an error, not a silent no-op
    "--strict-config",
    "--import-mode=importlib",
]
# Coverage is deliberately not in addopts: it slows every local run and
# interferes with debuggers. CI passes --cov explicitly.
markers = [
    "slow: takes more than a few seconds; deselect with '-m \"not slow\"'",
    "requires_data: needs a downloaded dataset, so it cannot run offline",
]
# Warnings are failures. A DeprecationWarning from numpy or torch is how a
# silent behaviour change arrives; discovering it at upgrade time is cheaper
# than discovering it in a result.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/evogfn"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
    "\\.\\.\\.",
]

[tool.uv]
# A CPU build and a CUDA build of torch cannot coexist. Declaring the conflict
# lets uv lock both resolutions in one lockfile and reject a request for both.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

# Marked `explicit` so these indexes are consulted only for packages routed to
# them below. Without that, every dependency would be looked up here first.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TC",   # flake8-type-checking
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]
ignore = [
    # Mathematical notation. This library implements objectives from published
    # papers, and readers check the code against the papers. Renaming `Z` to
    # `partition_function` or `L` to `sequence_length` inside a loss function
    # makes it *harder* to verify against the source, so single-capital names
    # are allowed where they mirror the reference notation.
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    # Conflicts with the formatter.
    "COM812",
    "ISC001",
    # Chosen docstring convention resolves these mutually exclusive pairs.
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # tests document themselves through their names
    "ANN",     # annotating every fixture adds noise, not safety
    "S101",    # assert is the entire point of a test
    "PLR2004", # magic values are how you write expected results
]
[tool.mypy]
# 3.12 rather than the 3.11 floor in requires-python. numpy's bundled type stubs
# use PEP 695 `type` statements, which mypy refuses to parse when targeting 3.11,
# and it gives up before checking anything of ours.
#
# Runtime support for 3.11 is guaranteed by the CI matrix instead, which is the
# stronger check anyway: 3.12-only syntax is a SyntaxError on 3.11, so the 3.11
# job fails at import rather than subtly.
python_version = "3.12"
files = ["src", "tests"]
strict = true
# Beyond --strict: catch code made dead by narrowing, and casts that no longer
# do anything. Both tend to appear when a signature changes underneath callers.
warn_unreachable = true
warn_redundant_casts = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",  # bare `# type: ignore` hides the next real error
    "possibly-undefined",
]
pretty = true

[[tool.mypy.overrides]]
# Tests favour readability over exhaustive annotation. They are still checked --
# a test that calls a function wrongly still fails -- they simply are not
# required to annotate every fixture and helper.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Follows from the above: if test helpers need not be annotated, calling them
# cannot be an error either.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed explicitly rather
# than globally ignoring missing imports, so a genuinely mistyped import of a
# typed package still fails.
module = ["hydra.*", "omegaconf.*", "wandb.*", "pymoo.*", "threadpoolctl"]
ignore_missing_imports = true
