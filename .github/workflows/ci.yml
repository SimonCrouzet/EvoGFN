name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # so a queued merge is verified against the post-merge tree

# Least privilege by default. Any job needing more requests it explicitly.
permissions:
  contents: read

# A new push to a branch makes the previous run's answer irrelevant. Cancel it
# rather than paying for it. Never cancel on main or in a merge queue, where
# every commit's result is a record that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  # Runners have no GPU. The CUDA build is 4.7GB of wheels that cannot be used;
  # the CPU build is 1.1GB. See the `cpu`/`cuda` extras in pyproject.toml.
  UV_EXTRA_ARGS: --extra cpu
  FORCE_COLOR: "1"

# Every uv sync below passes --locked, which fails if uv.lock is out of step
# with pyproject.toml rather than silently re-resolving. Without it CI could
# pass against a dependency set that nobody committed. (Note --locked is
# mutually exclusive with the UV_FROZEN environment variable, which asserts
# the opposite: use the lock without checking it.)

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dev tooling only
        # Linting needs ruff, not torch. Skipping the project install keeps
        # this job at a few seconds so style feedback arrives first.
        run: uv sync --only-group dev --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check --diff .

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install project and dev group
        # Unlike lint, mypy must import the real dependencies: checking against
        # missing stubs would pass while proving nothing.
        run: uv sync ${{ env.UV_EXTRA_ARGS }} --group dev --locked
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one version failing should not hide the others' results
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync ${{ env.UV_EXTRA_ARGS }} --group dev --locked
      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov --cov-report=xml --cov-report=term-missing
          --junitxml=junit-${{ matrix.python-version }}.xml
      - name: Upload test and coverage reports
        if: always() # a failed run is exactly when these are worth reading
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage.xml
          retention-days: 14

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatchling reads git metadata
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build
      - name: Check distribution metadata
        # Catches a malformed README or bad classifier here rather than at the
        # point of an irreversible upload to PyPI.
        run: uvx twine check --strict dist/*
      - name: Install the built wheel and run the console script
        # A build that imports is not a build that works: the declared console
        # script once pointed at a module that did not exist, and neither the
        # build nor twine check noticed, because neither runs it.
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          /tmp/wheelcheck/bin/evogfn --help
          /tmp/wheelcheck/bin/python -c "
          from importlib.resources import files
          assert files('evogfn.configs').joinpath('train.yaml').is_file()
          print('packaged configs present')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          retention-days: 14

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Single aggregating gate. Branch protection requires this one check, so the
  # matrix can gain or lose a Python version without anyone editing repository
  # settings -- and a job that is skipped or cancelled still fails the gate,
  # which a naive `needs` list would let through.
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] || exit 1
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ] || exit 1
          [ "${{ contains(needs.*.result, 'skipped') }}" = "false" ] || exit 1
